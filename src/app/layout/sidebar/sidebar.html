<aside class="hidden md:flex h-screen w-64 fixed left-0 top-0 bg-surface-container-high flex-col p-4 gap-y-2 z-50">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 py-4 mb-6">
        <div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center">
            <svg [lucideIcon]="LucideBrain" class="text-on-primary" [size]="20"></svg>
        </div>
        <div>
            <p class="text-lg font-black tracking-tight text-primary font-headline">RAG Chat</p>
            <p class="text-xs text-on-surface-variant font-medium">Inteligencia local</p>
        </div>
    </div>

    <!-- New Collection Button -->
    <a appButton routerLink="/collections" class="mb-6 w-full">
        <svg [lucideIcon]="LucideCirclePlus" [size]="16"></svg>
        Nueva colección
    </a>

    <!-- Navigation -->
    <nav class="flex flex-col gap-1" aria-label="Principal">
        @for (item of navItems(); track item.route) {
            <a
                [routerLink]="item.route"
                routerLinkActive="bg-surface-container-lowest text-primary-container font-semibold shadow-sm"
                [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-md outline-none focus-visible:outline-2 focus-visible:outline-surface-tint"
            >
                <svg [lucideIcon]="item.icon" [size]="18"></svg>
                <span class="text-sm">{{ item.label }}</span>
            </a>
        }
    </nav>
</aside>
